server:
  port: ${BENJAGEST_BACKEND_PORT:8080}

spring:
  application:
    name: benjagest-backend
  datasource:
    url: ${BENJAGEST_DB_URL:jdbc:mariadb://localhost:3306/benjagest}
    username: ${BENJAGEST_DB_USER:benjagest}
    password: ${BENJAGEST_DB_PASSWORD:benjagest}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      initialization-fail-timeout: 0
  sql:
    init:
      mode: never
  flyway:
    enabled: ${BENJAGEST_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    validate-on-migrate: true
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

benjagest:
  api-version: v1
  jwt:
    secret: ${BENJAGEST_JWT_SECRET:devSecretBenjagestNotForProduction_PleaseSetEnvVarBeforeDeployingForReal_2026}
    access-ttl-minutes: ${BENJAGEST_JWT_ACCESS_TTL:480}
    refresh-ttl-minutes: ${BENJAGEST_JWT_REFRESH_TTL:43200}
  encryption:
    # Master key para Jasypt. PRODUCCION: poner BENJAGEST_ENCRYPTION_PASSWORD
    # en env. Si cambia esta clave, los datos cifrados pasan a ser ilegibles.
    password: ${BENJAGEST_ENCRYPTION_PASSWORD:devEncryptionKeyBenjagestNotForProduction_2026}
