server:
  port: ${BENJAGEST_BACKEND_PORT:8080}
  error:
    # Incluir el mensaje de ResponseStatusException en la respuesta HTTP.
    # Sin esto, Spring devuelve solo {"status":403,"error":"Forbidden"} y
    # la UI no sabe si es sesión expirada o falta de módulo/rol.
    include-message: always
    include-binding-errors: always

spring:
  # Credenciales Google CENTRALES (secreto): se cargan desde un fichero
  # google-secrets.yml IGNORADO por git (no entra al repo; lo bloquea la
  # proteccion de secretos de GitHub y ademas no debe versionarse). El
  # instalador lo empaqueta. Si no existe, cada instalacion usa las SUYAS
  # desde Configuracion -> Integraciones (modelo hibrido).
  config:
    import: optional:classpath:google-secrets.yml
  application:
    name: benjagest-backend
  datasource:
    # VF-CHAIN-FIX 2026-06-08: connectionTimeZone=UTC fuerza al driver
    # mariadb-java-client a interpretar TIMESTAMP siempre en UTC,
    # independiente de la zona del JVM. Sin esto, la cadena hash SIF
    # se rompía sistémicamente tras cualquier reinicio: el INSERT pasaba
    # Timestamp.from(instant) (UTC), pero el SELECT podía leer el
    # Timestamp interpretándolo en la zona del sistema, dando un
    # Instant desplazado. Al recalcular el hash con un OffsetDateTime
    # distinto al original, todas las cadenas aparecían rotas.
    # forceConnectionTimeZoneToSession=true: aplica también a la sesión
    # MariaDB para que CURRENT_TIMESTAMP de la propia BD sea coherente.
    # Puerto 3307 = MariaDB 11.4 del proyecto BENJAGEST.
    # El 3306 lo ocupa otra instancia (entorno de Pablo) que tiene una BD
    # 'benjagest' casi vacía. Conectarse al 3306 por accidente produce un
    # bug muy confuso: la UI no ve los datos que sí están en BD (sesión
    # 2026-06-09 lo cazo). Si necesitas otro host/puerto, exporta
    # BENJAGEST_DB_URL antes de arrancar.
    url: ${BENJAGEST_DB_URL:jdbc:mariadb://localhost:3307/benjagest?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${BENJAGEST_DB_USER:benjagest}
    password: ${BENJAGEST_DB_PASSWORD:benjagest}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      initialization-fail-timeout: 0
      # Resiliencia del pool: si la BD se reinicia o el equipo se suspende, las
      # conexiones quedan muertas. Con esto Hikari valida antes de entregar
      # (SELECT 1), refresca las inactivas (keepalive) y retira las viejas
      # (max-lifetime), en vez de propagar "setNetworkTimeout cannot be called
      # on a closed connection".
      connection-test-query: SELECT 1
      keepalive-time: 150000        # 2,5 min: ping a conexiones inactivas
      max-lifetime: 600000          # 10 min: retira y recrea conexiones
      validation-timeout: 5000
      connection-timeout: 20000
  sql:
    init:
      mode: never
  flyway:
    enabled: ${BENJAGEST_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    table: flyway_schema_history
    validate-on-migrate: true
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

benjagest:
  api-version: v1
  jwt:
    secret: ${BENJAGEST_JWT_SECRET:devSecretBenjagestNotForProduction_PleaseSetEnvVarBeforeDeployingForReal_2026}
    access-ttl-minutes: ${BENJAGEST_JWT_ACCESS_TTL:480}
    refresh-ttl-minutes: ${BENJAGEST_JWT_REFRESH_TTL:43200}
  encryption:
    # Master key para Jasypt. RGPD (2026-07-08): si nadie define
    # BENJAGEST_ENCRYPTION_PASSWORD, MasterKeyResolver genera una clave
    # POR INSTALACION en %ProgramData%\BENJAGEST\secret\master.key (ACL
    # restringido) y la de desarrollo queda solo como fallback de
    # DESCIFRADO para lo cifrado antes de la rotacion. NO cambiar el
    # sentinel: MasterKeyResolver.DEV_SENTINEL debe coincidir con el.
    password: ${BENJAGEST_ENCRYPTION_PASSWORD:devEncryptionKeyBenjagestNotForProduction_2026}
  # google.client-id / google.client-secret (modelo HIBRIDO, decision Benjamin
  # 2026-06-26): NO se definen aqui A PROPOSITO. Las credenciales CENTRALES del
  # proyecto Google de BENJAGEST (cuenta benjagest2026@gmail.com, cliente OAuth
  # de escritorio) las aporta el fichero externo google-secrets.yml (cargado
  # arriba via spring.config.import), que esta IGNORADO por git. En su defecto,
  # las variables de entorno BENJAGEST_GOOGLE_CLIENT_ID / _SECRET. Si faltan, el
  # @Value usa "" y cada instalacion configura las SUYAS en Configuracion ->
  # Integraciones. NUNCA versionar el client-secret aqui (GitHub lo bloquea).
  # Pendiente: VERIFICACION del proyecto para quitar el aviso "app no verificada".
